services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-followup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-followup}
      POSTGRES_DB: ${POSTGRES_DB:-followup}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-followup}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: builder
    restart: "no"
    #exclude_from_hc: true
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        npx prisma migrate deploy &&
        npx tsx prisma/scripts/ensure-document-types.ts

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_COLLAB_WS_URL: ${NEXT_PUBLIC_COLLAB_WS_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      COLLAB_SECRET: ${COLLAB_SECRET}
      NEXT_PUBLIC_COLLAB_WS_URL: ${NEXT_PUBLIC_COLLAB_WS_URL:-ws://localhost:1234}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  collab:
    build:
      context: ./collab-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:1234"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      COLLAB_SECRET: ${COLLAB_SECRET}
      COLLAB_PORT: 1234
    ports:
      - "${COLLAB_PORT:-1234}:1234"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  uploads_data:
